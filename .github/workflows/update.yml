name: Update forecast

on:
  workflow_dispatch:        # manual "Run workflow" button on GitHub
  schedule:
    - cron: "0 6 * * *"     # daily 06:00 UTC — picks up the previous matchday

permissions:
  contents: write

concurrency:
  group: update-forecast
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run model
        run: python update.py

      - name: Commit forecast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add forecast.json odds_history.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update forecast $(date -u +%F)"
            git push
          fi
